name: Windows app

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to upload this build to, for example v0.8.0
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install Playwright for regression tests
        run: npm install --no-save --no-package-lock playwright@1.65.1

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run all regression tests
        shell: pwsh
        env:
          CI: 'true'
        run: |
          $tests = Get-ChildItem -Path tests -Filter '*_test.js' | Sort-Object Name
          if ($tests.Count -eq 0) {
            throw "No tests/*_test.js files were found."
          }
          foreach ($test in $tests) {
            Write-Host "===== Running $($test.Name) ====="
            node $test.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Test failed: $($test.Name) (exit code $LASTEXITCODE)"
            }
          }

      - name: Build Windows installer
        run: npm run dist:win

      - name: Generate updater manifest
        run: node scripts/write-update-manifest.cjs

      - name: Publish installer and updater files to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = $env:RELEASE_TAG
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tag = $env:GITHUB_REF_NAME
          } elseif ($env:GITHUB_REF -eq 'refs/heads/main') {
            $tag = "v$version"
          }

          if ($tag -ne "v$version") {
            throw "Release tag $tag must match package.json version v$version"
          }

          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "穿越三國 諸葛貓妖傳 $tag" --notes "Windows 桌面版；啟動時檢查更新，下載完成後可重新啟動安裝。"
            if ($LASTEXITCODE -ne 0) { throw "Could not create GitHub Release $tag" }
          }

          $installer = "dist/win/ChuanyueSanguo-$version-Setup.exe"
          gh release upload $tag $installer "$installer.blockmap" "dist/win/latest.yml" --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not upload installer and updater files to $tag" }

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChuanyueSanguo-Windows-${{ github.sha }}
          path: |
            dist/win/*.exe
            dist/win/*.exe.blockmap
            dist/win/latest.yml
          if-no-files-found: error
          retention-days: 30
