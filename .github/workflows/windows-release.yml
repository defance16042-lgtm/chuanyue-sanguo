name: Windows app

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build or publish Windows installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = node -p "require('./package.json').version"
            if ($env:GITHUB_REF_NAME -ne "v$version") {
              throw "Release tag $env:GITHUB_REF_NAME must match package.json version v$version"
            }
            npm run release:win
          } else {
            npm run dist:win
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChuanyueSanguo-Windows-${{ github.sha }}
          path: dist/win/*.exe
          if-no-files-found: error
          retention-days: 30
